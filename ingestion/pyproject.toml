[project]
name = "elleito-ingestion"
version = "0.1.0"
description = "Pipelines de ingestão de dados eleitorais (TSE, IBGE) para o elleito.ai"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "elleito.ai" }]

dependencies = [
  "basedosdados>=2.0.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "psycopg[binary]>=3.1.18",
  "sqlalchemy>=2.0.0",
  "structlog>=24.1.0",
  "tenacity>=8.2.0",
  "click>=8.1.0",
  "python-dotenv>=1.0.0",
  "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
]

[project.scripts]
elleito-etl = "elleito_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elleito_ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
